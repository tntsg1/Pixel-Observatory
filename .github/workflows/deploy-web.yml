name: Deploy Web Build

on:
  push:
    branches:
      - main
      - agent/current-version-2026-07-18
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download game assets from Git LFS
        run: git lfs pull --include="assets/**" --exclude=""

      - name: Install Godot and export templates
        env:
          GODOT_RELEASE: 4.7-stable
          GODOT_TEMPLATE_VERSION: 4.7.stable
        run: |
          curl --fail --location --silent --show-error \
            --output godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
          unzip -q godot.zip
          chmod +x "Godot_v${GODOT_RELEASE}_linux.x86_64"

          curl --fail --location --silent --show-error \
            --output templates.tpz \
            "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_export_templates.tpz"
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_TEMPLATE_VERSION}"
          unzip -q templates.tpz -d "$HOME/.local/share/godot/export_templates/${GODOT_TEMPLATE_VERSION}"
          mv "$HOME/.local/share/godot/export_templates/${GODOT_TEMPLATE_VERSION}/templates/"* \
            "$HOME/.local/share/godot/export_templates/${GODOT_TEMPLATE_VERSION}/"
          rmdir "$HOME/.local/share/godot/export_templates/${GODOT_TEMPLATE_VERSION}/templates"

      - name: Export browser build
        run: |
          node tools/prepare_web_export.mjs
          mkdir -p build/web/.godot-export
          ./Godot_v4.7-stable_linux.x86_64 --headless --path . --import
          ./Godot_v4.7-stable_linux.x86_64 --headless --path . \
            --script res://tools/fast_music_rights_audit_test.gd
          ./Godot_v4.7-stable_linux.x86_64 --headless --path . --export-release Web build/web/.godot-export/index.html

      - name: Verify retired remote audio is absent
        run: |
          test ! -e assets/audio/music/giant_telescope.mp3
          test ! -e assets/audio/music/space_fast_theme.mp3
          test ! -e assets/audio/ambient/fast_terminal_hum.ogg
          test ! -e build/web/giant_telescope.mp3
          test ! -e build/web/space_fast_theme.mp3
          test ! -e build/web/fast_terminal_hum.ogg

      - name: Add Pixel Observatory web shell
        env:
          PIXEL_OBSERVATORY_BUILD_SHA: ${{ github.sha }}
        run: |
          node tools/build_web_shell.mjs build/web build/web/.godot-export
          node tools/verify_web_game_shell.mjs build/web

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
